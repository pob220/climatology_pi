name: Check Windows package display
on:
  workflow_dispatch:
    inputs:
      run_id:
        type: string
        required: true
        description: Build run containing the final native packages
permissions:
  contents: read
  actions: read
jobs:
  version-display:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            artifact: windows-wx32-x86
          - arch: x64
            artifact: windows-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          name: ${{ matrix.artifact }}
          path: retained-package
      - name: Import and inspect the actual Plugin Manager version
        run: python ci/public-packages/check-windows-artifact.py '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-version-${{ matrix.arch }}
          path: artifacts/windows-version/
